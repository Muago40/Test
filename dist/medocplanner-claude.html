<title>MédocPlanner</title>
<style>
:root {
  --fond: #f1f5f4;
  --carte: #ffffff;
  --texte: #10201e;
  --doux: #5b6b69;
  --bord: #dbe4e2;
  --primaire: #0f766e;
  --primaire-texte: #ffffff;
  --primaire-doux: #e0f2ef;
  --danger: #b42318; --danger-doux: #fde8e6;
  --warning: #b54708; --warning-doux: #fef0e1;
  --caution: #8a6d00; --caution-doux: #fdf6d8;
  --info: #175cd3; --info-doux: #e5efff;
  --ok: #067647; --ok-doux: #e3f6ec;
  --rayon: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0c1514; --carte: #142120; --texte: #e6efed; --doux: #9fb1ae; --bord: #24403d;
    --primaire: #2bb3a6; --primaire-texte: #04201d; --primaire-doux: #12302d;
    --danger: #ff8a80; --danger-doux: #3a1714; --warning: #ffb36b; --warning-doux: #3a2410;
    --caution: #f0d062; --caution-doux: #332a08; --info: #8ab4ff; --info-doux: #13254a;
    --ok: #6fdba5; --ok-doux: #0f2f20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --fond: #0c1514; --carte: #142120; --texte: #e6efed; --doux: #9fb1ae; --bord: #24403d;
    --primaire: #2bb3a6; --primaire-texte: #04201d; --primaire-doux: #12302d;
    --danger: #ff8a80; --danger-doux: #3a1714; --warning: #ffb36b; --warning-doux: #3a2410;
    --caution: #f0d062; --caution-doux: #332a08; --info: #8ab4ff; --info-doux: #13254a;
    --ok: #6fdba5; --ok-doux: #0f2f20;
    color-scheme: dark;
  }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--texte);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
h1, h2, h3, h4 { margin: 0 0 .5rem; line-height: 1.2; }
h2 { font-size: 1.15rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; margin-top: .5rem; }
ul { margin: .25rem 0; padding-left: 1.2rem; }
pre { white-space: pre-wrap; font-size: .85rem; background: var(--fond); padding: .5rem; border-radius: 8px; }

.entete {
  display: flex; align-items: center; gap: .5rem; padding: .8rem 16px;
  padding-top: calc(.8rem + env(safe-area-inset-top));
  background: var(--primaire); color: var(--primaire-texte);
}
.entete h1 { font-size: 1.2rem; margin: 0; }
.logo { font-size: 1.4rem; }

main { max-width: 720px; margin: 0 auto; padding: 12px 16px; }

.carte {
  background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon);
  padding: 16px; margin-bottom: 12px;
}
.carte.surligne { border-color: var(--primaire); box-shadow: 0 0 0 2px var(--primaire-doux); }
.carte.vide { text-align: center; color: var(--doux); }
details.carte summary { cursor: pointer; font-weight: 600; }
details.carte[open] summary { margin-bottom: .75rem; }

.aide { color: var(--doux); font-size: .9rem; margin: .4rem 0; }
.sous { color: var(--doux); font-size: .88rem; display: block; }
.sous.ok { color: var(--ok); }
.centre { text-align: center; }
.source { font-size: .82rem; color: var(--doux); font-style: italic; margin-top: .2rem; }

.bouton {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 44px; padding: .55rem 1rem; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
  font: inherit; font-weight: 600; text-align: center;
}
.bouton:hover { border-color: var(--primaire); }
.bouton.principal { background: var(--primaire); color: var(--primaire-texte); border-color: var(--primaire); }
.bouton.danger { color: var(--danger); border-color: var(--danger); }
.bouton[disabled] { opacity: .5; cursor: not-allowed; }
.bouton.large { width: 100%; }
.bouton.rond { width: 44px; padding: 0; border-radius: 50%; font-size: 1.4rem; }
.ligne-boutons { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
.ligne-boutons > * { flex: 1 1 auto; }
.ligne-boutons.petit .bouton { min-height: 36px; padding: .3rem .8rem; font-size: .88rem; flex: 0 0 auto; }

input, select, textarea {
  width: 100%; font: inherit; color: var(--texte); background: var(--carte);
  border: 1px solid var(--bord); border-radius: 10px; padding: .6rem .7rem; margin-top: .25rem;
}
input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: var(--primaire); flex: none; }
label { display: block; margin: .6rem 0; font-size: .92rem; }
label.case, label.interrupteur { display: flex; align-items: center; gap: .6rem; }
fieldset { border: 1px solid var(--bord); border-radius: 10px; margin: .6rem 0; padding: .5rem .8rem; }
legend { font-weight: 600; font-size: .9rem; padding: 0 .3rem; }
textarea { resize: vertical; margin-bottom: .6rem; }
.deux-col { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.grille-heures { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 .8rem; }

.apercu { width: 100%; max-height: 320px; object-fit: contain; border-radius: 10px; margin-top: .75rem; background: var(--fond); }

.liste { list-style: none; padding: 0; margin: 0; }
.liste > li { padding: .75rem 0; border-top: 1px solid var(--bord); }
.liste > li:first-child { border-top: 0; padding-top: .25rem; }
.liste > li.termine { opacity: .55; }
.ligne-titre { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }

.pastille {
  display: inline-block; font-size: .75rem; font-weight: 700; padding: .15rem .55rem; border-radius: 999px;
  background: var(--fond); color: var(--doux);
}
.pastille.danger { background: var(--danger-doux); color: var(--danger); }
.pastille.warning { background: var(--warning-doux); color: var(--warning); }
.pastille.caution { background: var(--caution-doux); color: var(--caution); }
.pastille.info { background: var(--info-doux); color: var(--info); }
.legende { display: flex; flex-wrap: wrap; gap: .35rem; }

.alerte { padding: .75rem; border-radius: 10px; font-size: .92rem; }
.alerte.danger { background: var(--danger-doux); color: var(--danger); }
.alerte.warning { background: var(--warning-doux); color: var(--warning); }
.alerte.info { background: var(--info-doux); color: var(--info); }
.alerte.ok { background: var(--ok-doux); color: var(--ok); }

.interaction { border-left: 4px solid var(--bord); padding-left: .75rem !important; margin: .25rem 0; }
.interaction.danger { border-left-color: var(--danger); }
.interaction.warning { border-left-color: var(--warning); }
.interaction.caution { border-left-color: var(--caution); }
.interaction.info { border-left-color: var(--info); }
.interaction p { margin: .35rem 0; font-size: .92rem; }
.conduite { font-weight: 600; }

.chargement { padding: .75rem; color: var(--primaire); font-weight: 600; }
.chargement::before {
  content: ""; display: inline-block; width: 14px; height: 14px; margin-right: .5rem; vertical-align: -2px;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: tourne .8s linear infinite;
}
@keyframes tourne { to { transform: rotate(360deg); } }

/* Planning */
.nav-date { display: flex; align-items: center; justify-content: space-between; text-align: center; }
.jour { font-size: 1.2rem; font-weight: 700; text-transform: capitalize; }
.progression-jour { height: 8px; background: var(--fond); border-radius: 99px; overflow: hidden; margin-top: .9rem; }
.progression-jour > div { height: 100%; background: var(--ok); transition: width .3s; }
.creneau-tete { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .4rem; }
.heure { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--primaire); }
.creneau.fait { opacity: .7; }
.creneau.fait .heure { color: var(--ok); }
.creneau.retard { border-color: var(--warning); }
.creneau.retard .heure { color: var(--warning); }
.prise label { display: flex; gap: .75rem; align-items: flex-start; margin: 0; cursor: pointer; }
.prise input { margin-top: 2px; }
.prise-ok strong { text-decoration: line-through; text-decoration-color: var(--doux); }

/* Fiches */
.fiche .famille { color: var(--primaire); font-weight: 600; font-size: .92rem; }
.fiche .poso { background: var(--primaire-doux); padding: .5rem .7rem; border-radius: 8px; margin: .6rem 0; font-size: .92rem; }
.fiche .moment { font-weight: 600; margin: .2rem 0; }
.grille-fiche { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem 1rem; font-size: .92rem; }
.grille-fiche .pleine { grid-column: 1 / -1; }
@media (max-width: 520px) { .grille-fiche { grid-template-columns: 1fr; } }

/* Navigation */
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--carte); border-top: 1px solid var(--bord);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  position: relative; background: none; border: 0; padding: .45rem 0 .5rem; cursor: pointer;
  font: inherit; font-size: .7rem; color: var(--doux); display: flex; flex-direction: column; align-items: center; gap: .1rem;
}
nav button span { font-size: 1.3rem; filter: grayscale(.6); }
nav button.actif { color: var(--primaire); font-weight: 700; }
nav button.actif span { filter: none; }
.badge {
  position: absolute; top: 4px; left: 55%; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
  background: var(--danger); color: var(--carte); font-size: .68rem; line-height: 18px;
}

dialog {
  width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto;
  border: 1px solid var(--bord); border-radius: var(--rayon); padding: 16px;
  background: var(--carte); color: var(--texte);
}
dialog::backdrop { background: rgba(0, 0, 0, .45); }

.bandeau {
  background: var(--caution-doux); color: var(--texte); border-bottom: 1px solid var(--bord);
  padding: .75rem 16px; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: .9rem;
}
.bandeau p { margin: 0; flex: 1 1 260px; }

#toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20;
  max-width: 560px; margin: 0 auto; background: var(--texte); color: var(--fond);
  padding: .9rem 1rem; border-radius: 12px; white-space: pre-line;
  transform: translateY(150%); opacity: 0; transition: .3s; pointer-events: none;
}
#toast.visible { transform: none; opacity: 1; }
#toast::first-line { font-weight: 700; }

.print-only { display: none; }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .entete, nav, .no-print, .bandeau, #toast { display: none !important; }
  .print-only { display: block; }
  .carte { border: 1px solid #ccc; break-inside: avoid; }
  main { max-width: none; }
}

dialog.confirmation { width: min(420px, calc(100% - 24px)); }
dialog.confirmation p { margin: 0 0 .5rem; }

/* Mode professionnel */
.entete { flex-wrap: wrap; }
.choix-patient {
  margin-left: auto; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--primaire-texte); color: var(--primaire); border: 0; border-radius: 999px;
  padding: .45rem .9rem; font: inherit; font-weight: 700; cursor: pointer; min-height: 40px;
}
.patient-actif { background: var(--primaire-doux); border-radius: 10px; padding-left: .6rem !important; padding-right: .6rem !important; }
.qr { background: #fff; padding: 12px; border-radius: 12px; max-width: 320px; margin: .75rem auto; }
.qr svg { display: block; width: 100%; height: auto; }
.etapes { padding-left: 1.3rem; margin: .5rem 0; font-size: .92rem; }
.etapes li { margin: .25rem 0; }
.video-scan { width: 100%; border-radius: 12px; margin-top: .75rem; background: #000; }

/* Impression du plan de traitement */
#impression { display: none; }
@media print {
  body.mode-impression > *:not(#impression) { display: none !important; }
  body.mode-impression #impression { display: block; }
  @page { margin: 12mm; }
}

/* Champs de fichier : présents (pas display:none) pour que tous les téléphones ouvrent le sélecteur */
.choix-photo { display: grid; gap: .5rem; }
label.bouton { position: relative; overflow: hidden; }
.champ-fichier { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

</style>
<header class="entete">
    <span class="logo" aria-hidden="true">💊</span>
    <h1>MédocPlanner</h1>
    <button id="choix-patient" class="choix-patient" hidden></button>
  </header>

  <main id="contenu" aria-live="polite"></main>

  <nav aria-label="Navigation principale">
    <button data-vue="ordonnance"><span>📷</span>Ordonnance</button>
    <button data-vue="planning"><span>🗓️</span>Planning</button>
    <button data-vue="fiches"><span>📘</span>Fiches</button>
    <button data-vue="interactions"><span>⚖️</span>Interactions<b id="badge-interactions" class="badge" hidden></b></button>
    <button data-vue="reglages"><span>⏰</span>Alarmes</button>
  </nav>

  <dialog id="dialogue"></dialog>
  <dialog id="confirmation" class="confirmation"></dialog>
  <div id="toast" role="alert"></div>
  <div id="impression"></div>

  <script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;

<script type="module">
// ── js/plateforme.js ──
// Détection de l'environnement d'exécution.
//  - "web"      : site classique (localhost, GitHub Pages…) : service worker, notifications,
//                 OCR local Tesseract, clé API Anthropic optionnelle.
//  - "claude"   : page publiée sur claude.ai : IA intégrée (capacité `sample`, sans clé API),
//                 sauvegarde sur le compte (`db`), export de fichiers (`downloads`).

const capacites = {};

const estClaude = typeof window !== "undefined" && typeof window.claude?.use === "function";

async function capacite(nom) {
  if (!estClaude) return null;
  if (!(nom in capacites)) {
    capacites[nom] = window.claude.use(nom).catch(() => null);
  }
  return capacites[nom];
}

/** L'IA intégrée de claude.ai peut-elle lire des images ? */
async function iaIntegreeImages() {
  const s = await capacite("sample");
  if (!s) return false;
  try { return !!(await s.limits())?.images; } catch { return false; }
}

// ── js/ui.js ──
// Messages et confirmations dans la page (alert/confirm ne sont pas disponibles partout,
// notamment dans les pages publiées sur claude.ai).

let minuteur = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function informer(message, duree = 5000) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = message;
  el.classList.add("visible");
  clearTimeout(minuteur);
  minuteur = setTimeout(() => el.classList.remove("visible"), duree);
}

function confirmer(message, libelleOk = "Confirmer") {
  return new Promise((resoudre) => {
    const dlg = document.getElementById("confirmation");
    dlg.replaceChildren();
    const p = document.createElement("p");
    p.textContent = message;
    const ligne = document.createElement("div");
    ligne.className = "ligne-boutons";
    const non = Object.assign(document.createElement("button"), { className: "bouton", textContent: "Annuler", type: "button" });
    const oui = Object.assign(document.createElement("button"), { className: "bouton principal", textContent: libelleOk, type: "button" });
    ligne.append(non, oui);
    dlg.append(p, ligne);
    const fin = (v) => { dlg.close(); resoudre(v); };
    non.onclick = () => fin(false);
    oui.onclick = () => fin(true);
    dlg.oncancel = () => resoudre(false);
    dlg.showModal();
  });
}

// Index de recherche : nom normalisé → médicament
function normaliser(s) {
  return (s || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9/ -]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function trouverParId(id) {
  return MEDICAMENTS.find((m) => m.id === id) || null;
}

function correspond(med, selecteurs) {
  return selecteurs.some((s) => s === med.id || med.classes.includes(s));
}

/**
 * Analyse les interactions entre une liste de médicaments de la base.
 * @param {Array<{med:object, nom:string}>} items
 * @returns {Array} interactions triées par gravité décroissante
 */
function analyserInteractions(items) {
  const resultats = [];
  for (let i = 0; i < items.length; i++) {
    for (let j = i + 1; j < items.length; j++) {
      const A = items[i], B = items[j];
      if (!A.med || !B.med) continue;
      const memeMed = A.med.id === B.med.id;
      const vus = new Set();
      REGLES.forEach((r, idx) => {
        const ok = (correspond(A.med, r.a) && correspond(B.med, r.b)) ||
                   (correspond(B.med, r.a) && correspond(A.med, r.b));
        if (ok && !vus.has(idx)) {
          vus.add(idx);
          resultats.push({ ...r, a: A.nom, b: B.nom });
        }
      });
      if (memeMed) {
        resultats.push({
          a: A.nom, b: B.nom, niveau: "AD",
          risque: "Le même médicament apparaît deux fois : risque de surdosage.",
          conduite: "Vérifier l'ordonnance : il s'agit probablement d'un doublon ou d'un changement de dose.",
        });
      }
    }
  }
  // Pour une même paire, on évite les règles génériques redondantes (ex. "sédatif + sédatif")
  // lorsqu'une règle plus grave et plus spécifique couvre déjà la paire.
  const parPaire = new Map();
  for (const r of resultats) {
    const k = [r.a, r.b].sort().join("|");
    if (!parPaire.has(k)) parPaire.set(k, []);
    parPaire.get(k).push(r);
  }
  const final = [];
  for (const liste of parPaire.values()) {
    const max = Math.max(...liste.map((r) => NIVEAUX[r.niveau].rang));
    for (const r of liste) {
      if (r.generique && NIVEAUX[r.niveau].rang < max) continue;
      final.push(r);
    }
  }
  return final.sort((x, y) => NIVEAUX[y.niveau].rang - NIVEAUX[x.niveau].rang);
}

// ── js/parser.js ──
// Analyse du texte d'une ordonnance (issu de l'OCR) pour en extraire
// les médicaments et leur posologie.

const MOMENTS = ["matin", "midi", "soir", "coucher"];

const UNITES = {
  comprime: "comprimé", cp: "comprimé", gelule: "gélule", gel: "gélule", sachet: "sachet",
  cuillere: "cuillère", cuill: "cuillère", bouffee: "bouffée", goutte: "goutte", ampoule: "ampoule",
  suppositoire: "suppositoire", suppo: "suppositoire", application: "application", dose: "dose",
  injection: "injection", pulverisation: "pulvérisation", capsule: "capsule", lyoc: "lyoc",
  pipette: "pipette", patch: "patch", unidose: "unidose",
};

const NOMBRES = { un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, demi: 0.5, "1/2": 0.5 };

// Distance de Levenshtein bornée (tolérance aux erreurs d'OCR)
function levenshtein(a, b, max = 3) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let cur = [i];
    let minLigne = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      minLigne = Math.min(minLigne, cur[j]);
    }
    if (minLigne > max) return max + 1;
    for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

// Construit l'index des noms (y compris noms composés)
const INDEX = [];
for (const m of MEDICAMENTS) {
  const noms = new Set([...m.noms, normaliser(m.dci)]);
  for (const n of noms) INDEX.push({ nom: normaliser(n), med: m });
}
// Les noms les plus longs d'abord (ex. « dafalgan codeine » avant « dafalgan »)
INDEX.sort((x, y) => y.nom.length - x.nom.length);

/** Recherche un médicament de la base dans une ligne de texte. */
function detecterMedicament(ligne) {
  const txt = " " + normaliser(ligne) + " ";
  // 1) correspondance exacte (mot entier)
  for (const e of INDEX) {
    if (txt.includes(" " + e.nom + " ") || txt.includes(" " + e.nom + "/")) return { med: e.med, trouve: e.nom, exact: true };
  }
  // 2) correspondance approchée mot à mot (erreurs d'OCR)
  const mots = txt.trim().split(" ").filter((w) => w.length >= 5);
  let meilleur = null;
  for (const mot of mots) {
    for (const e of INDEX) {
      if (e.nom.includes(" ") || e.nom.length < 5) continue;
      const tol = e.nom.length >= 9 ? 2 : 1;
      const d = levenshtein(mot, e.nom, tol);
      if (d <= tol && (!meilleur || d < meilleur.d)) meilleur = { med: e.med, trouve: mot, d };
    }
  }
  return meilleur ? { med: meilleur.med, trouve: meilleur.trouve, exact: false } : null;
}

function nombre(s) {
  if (!s) return null;
  s = s.replace(",", ".");
  if (NOMBRES[s] !== undefined) return NOMBRES[s];
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

/** Extrait la posologie d'un bloc de texte relatif à un médicament. */
function extrairePosologie(bloc) {
  const t = normaliser(bloc).replace(/\s*-\s*/g, "-");
  const res = {
    dosage: "",
    quantite: 1,
    unite: "prise",
    moments: [],
    heures: [],
    siBesoin: false,
    dureeJours: null,
    hebdomadaire: false,
    remarques: [],
  };

  const dos = bloc.match(/(\d+(?:[.,]\d+)?)\s*(mg|g|µg|mcg|ui|ml|%)\b/i);
  if (dos) res.dosage = dos[1].replace(".", ",") + " " + dos[2].toLowerCase();

  const formes = "(comprimes?|cp|cps|gelules?|gel|sachets?|cuilleres?|cuill|bouffees?|gouttes?|ampoules?|suppositoires?|suppo|applications?|doses?|injections?|pulverisations?|capsules?|lyocs?|pipettes?|patchs?|unidoses?)";
  const q = t.match(new RegExp("(\\d+(?:[.,]\\d+)?|un|une|deux|trois|quatre|demi|1/2)\\s*" + formes));
  if (q) {
    res.quantite = nombre(q[1]) ?? 1;
    res.unite = UNITES[q[2].replace(/s$/, "")] || q[2];
  }

  // Schéma "1-0-1" ou "1-1-1-1" (matin-midi-soir[-coucher])
  const schema = t.match(/\b(\d(?:[.,]5)?)-(\d(?:[.,]5)?)-(\d(?:[.,]5)?)(?:-(\d(?:[.,]5)?))?\b/);
  if (schema) {
    const vals = schema.slice(1, 5).map((v) => (v === undefined ? 0 : nombre(v)));
    vals.forEach((v, i) => { if (v > 0) res.moments.push(MOMENTS[i]); });
    const nz = vals.filter((v) => v > 0);
    if (nz.length && nz.every((v) => v === nz[0])) res.quantite = nz[0];
  }

  // Moments explicites
  if (!res.moments.length) {
    if (/\bmatin|petit[- ]dejeuner|au lever|reveil\b/.test(t)) res.moments.push("matin");
    if (/\bmidi|dejeuner\b/.test(t.replace(/petit[- ]dejeuner/g, ""))) res.moments.push("midi");
    if (/\bsoir|diner|souper\b/.test(t)) res.moments.push("soir");
    if (/\bcoucher|nuit\b/.test(t)) res.moments.push("coucher");
  }

  // Fréquence : "3 fois par jour", "x2/j", "2 prises par jour"
  const freq = t.match(/(\d|un|une|deux|trois|quatre)\s*(?:fois|x|prises?)\s*(?:par|\/|le)?\s*(?:jour|j|24 ?h)\b/) ||
               t.match(/\bx\s*(\d)\s*(?:\/|par)\s*(?:jour|j)\b/);
  const parJour = freq ? nombre(freq[1]) : null;
  if (!res.moments.length && parJour) {
    res.moments = { 1: ["matin"], 2: ["matin", "soir"], 3: ["matin", "midi", "soir"], 4: ["matin", "midi", "soir", "coucher"] }[parJour] || [];
  }

  // "toutes les 6 heures"
  const inter = t.match(/toutes les (\d+)\s*(?:h|heures)\b/);
  if (inter) {
    const pas = parseInt(inter[1], 10);
    if (pas >= 4 && pas <= 24) {
      res.moments = [];
      for (let h = 8; h < 8 + 24; h += pas) res.heures.push(String(h % 24).padStart(2, "0") + ":00");
    }
  }

  if (/\bsi besoin|si douleur|en cas de|si fievre|a la demande|si necessaire\b/.test(t)) res.siBesoin = true;
  if (/par semaine|\/ ?semaine|hebdomadaire|une fois par semaine|1 fois par semaine/.test(t)) res.hebdomadaire = true;

  // Durée
  const d = t.match(/(?:pendant|durant|pdt|sur|x)\s*(\d+|un|une|deux|trois|quatre|cinq|six)\s*(jours?|j|semaines?|sem|mois)\b/) ||
            t.match(/\b(\d+)\s*(jours?|j|semaines?|mois)\b(?!.*\bpar\b)/);
  if (d) {
    const n = nombre(d[1]) || 0;
    const u = d[2];
    res.dureeJours = u.startsWith("sem") ? n * 7 : u.startsWith("mois") ? n * 30 : n;
  }
  if (/qsp\s*(\d+)\s*(mois|jours?|semaines?)/.test(t)) {
    const m = t.match(/qsp\s*(\d+)\s*(mois|jours?|semaines?)/);
    const n = parseInt(m[1], 10);
    res.dureeJours = m[2].startsWith("mois") ? n * 30 : m[2].startsWith("sem") ? n * 7 : n;
  }
  if (/a renouveler|renouvelable/.test(t)) res.remarques.push("Ordonnance renouvelable");
  if (/a jeun/.test(t)) res.remarques.push("À jeun");
  if (/(au cours|pendant|au milieu|a la fin) d[ue]s? repas/.test(t)) res.remarques.push("Pendant le repas");
  if (/avant (le|les) repas/.test(t)) res.remarques.push("Avant le repas");

  if (!res.moments.length && !res.heures.length && !res.siBesoin) res.moments = ["matin"];
  return res;
}

// Nom affiché : celui écrit sur l'ordonnance (ex. « Doliprane ») si reconnu exactement, sinon la DCI.
function nomAffiche(det) {
  if (!det.exact || det.trouve === normaliser(det.med.dci)) return det.med.dci;
  return det.trouve.replace(/(^|[ -])([a-z])/g, (_, s, c) => s + c.toUpperCase());
}

/**
 * Analyse un texte complet d'ordonnance.
 * Découpe en blocs : chaque ligne contenant un médicament reconnu ouvre un bloc ;
 * les lignes suivantes (posologie) lui sont rattachées jusqu'au prochain médicament.
 */
function analyserOrdonnance(texte) {
  const lignes = texte.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const blocs = [];
  for (const ligne of lignes) {
    const det = detecterMedicament(ligne);
    if (det) blocs.push({ det, lignes: [ligne] });
    else if (blocs.length) {
      const dernier = blocs[blocs.length - 1];
      if (dernier.lignes.length < 4) dernier.lignes.push(ligne);
    }
  }
  return blocs.map(({ det, lignes }) => {
    const bloc = lignes.join(" ");
    const poso = extrairePosologie(bloc);
    return {
      nom: nomAffiche(det) + (poso.dosage ? " " + poso.dosage : ""),
      medId: det.med.id,
      texteSource: bloc,
      certitude: det.exact ? "haute" : "moyenne",
      ...poso,
    };
  });
}

// ── js/store.js ──
// Persistance des données.
//  - Toujours : stockage local du navigateur (affichage immédiat, hors ligne).
//  - Sur claude.ai : en plus, sauvegarde privée sur le compte de l'utilisateur
//    (documents sous data/users/<id>/, illisibles par toute autre personne).
//
// Les données sont organisées en profils : un seul (« Moi ») en mode patient,
// un par patient en mode professionnel. `etat.traitements` et `etat.prises`
// désignent toujours ceux du profil actif.

const CLE = "medoc-planner:v1";

const REGLAGES_DEFAUT = {
  heures: { matin: "08:00", midi: "12:30", soir: "19:30", coucher: "22:00" },
  alarmes: false,
  son: true,
  rappelMinutes: 15, // relance si la prise n'est pas cochée
  cleApi: "",
  avertissementLu: false,
  mode: "patient",   // "patient" | "pro"
  pro: { nom: "", contact: "" },
  adressePublique: "", // adresse de l'appli à donner aux patients (QR code)
};

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function nouveauProfil(champs = {}) {
  return { id: uid(), nom: "Moi", naissance: "", allergies: "", notes: "", traitements: [], prises: {}, ...champs };
}

function normaliserEtat(brut = {}) {
  let profils = Array.isArray(brut.profils) ? brut.profils : null;
  if (!profils) {
    // Ancien format (un seul jeu de traitements)
    profils = [nouveauProfil({ id: "moi", traitements: brut.traitements || [], prises: brut.prises || {} })];
  }
  profils = profils.map((p) => nouveauProfil({ ...p, traitements: p.traitements || [], prises: p.prises || {} }));
  const actif = profils.some((p) => p.id === brut.profilActif) ? brut.profilActif : profils[0].id;
  const r = brut.reglages || {};
  return {
    profils,
    profilActif: actif,
    reglages: { ...REGLAGES_DEFAUT, ...r, heures: { ...REGLAGES_DEFAUT.heures, ...(r.heures || {}) }, pro: { ...REGLAGES_DEFAUT.pro, ...(r.pro || {}) } },
  };
}

function lireLocal() {
  try { return normaliserEtat(JSON.parse(localStorage.getItem(CLE) || "{}")); }
  catch { return normaliserEtat(); }
}

const etat = lireLocal();

function profilActif() {
  return etat.profils.find((p) => p.id === etat.profilActif) || etat.profils[0];
}
// Raccourcis vers le profil actif (non sérialisés)
Object.defineProperty(etat, "traitements", { get: () => profilActif().traitements, set: (v) => { profilActif().traitements = v; }, enumerable: false });
Object.defineProperty(etat, "prises", { get: () => profilActif().prises, set: (v) => { profilActif().prises = v; }, enumerable: false });

const abonnes = new Set();
function abonner(fn) { abonnes.add(fn); }
function notifierAbonnes() { abonnes.forEach((fn) => fn(etat)); }

// ─────────── Sauvegarde sur le compte claude.ai ───────────
let compte = null;          // { db, uid }
let dernierEnvoi = {};      // id de document → JSON envoyé (pour n'écrire que ce qui change)
let envoiPrevu = null;
let envoiEnCours = Promise.resolve();

function documentsAEnvoyer() {
  const { cleApi, ...reglages } = etat.reglages; // la clé API ne quitte jamais l'appareil
  const docs = {
    etat: {
      profils: etat.profils.map(({ prises, ...p }) => p),
      profilActif: etat.profilActif,
      reglages,
    },
  };
  // Historique des prises : un document par profil et par mois (taille de document limitée)
  for (const p of etat.profils) {
    for (const [k, v] of Object.entries(p.prises)) {
      const id = `prises-${p.id}-${k.slice(0, 7)}`;
      (docs[id] ||= { profil: p.id, prises: {} }).prises[k] = v;
    }
  }
  // Documents devenus vides (prises retirées, profil supprimé)
  for (const id of Object.keys(dernierEnvoi)) if (id.startsWith("prises-") && !docs[id]) docs[id] = null;
  return docs;
}

function planifierEnvoi() {
  if (!compte) return;
  clearTimeout(envoiPrevu);
  envoiPrevu = setTimeout(() => {
    envoiEnCours = envoiEnCours.then(async () => {
      for (const [id, data] of Object.entries(documentsAEnvoyer())) {
        const json = JSON.stringify(data);
        if (dernierEnvoi[id] === json) continue;
        const ref = compte.db.collection("data/users/" + compte.uid).doc(id);
        try {
          if (data === null) { await ref.delete(); delete dernierEnvoi[id]; }
          else { await ref.set(data); dernierEnvoi[id] = json; }
        } catch (e) { console.warn("Sauvegarde du compte impossible", id, e); }
      }
    });
  }, 800);
}

/** Connecte la sauvegarde du compte (claude.ai) et récupère les données existantes. */
async function connecterCompte() {
  const [db, user] = await Promise.all([capacite("db"), capacite("user")]);
  if (!db || !user) return false;
  let id;
  try { id = await user.id(); } catch { return false; }
  if (!id) return false;
  compte = { db, uid: id };
  try {
    const snap = await db.collection("data/users/" + id).limit(1000).get();
    const docs = {};
    // Les snapshots sont figés : copie profonde avant toute modification
    snap.docs.forEach((d) => { if (d.exists) docs[d.id] = JSON.parse(JSON.stringify(d.data())); });
    if (docs.etat) {
      let brut;
      if (Array.isArray(docs.etat.profils)) {
        const prisesPar = {};
        for (const [k, d] of Object.entries(docs)) {
          if (k.startsWith("prises-") && d.profil) Object.assign((prisesPar[d.profil] ||= {}), d.prises || {});
        }
        brut = { ...docs.etat, profils: docs.etat.profils.map((p) => ({ ...p, prises: prisesPar[p.id] || {} })) };
      } else {
        // format de la version précédente
        const prises = {};
        for (const [k, d] of Object.entries(docs)) if (k.startsWith("prises-")) Object.assign(prises, d.prises || {});
        brut = { traitements: docs.etat.traitements, reglages: docs.etat.reglages, prises };
        for (const k of Object.keys(docs)) if (k.startsWith("prises-")) dernierEnvoi[k] = "ancien";
      }
      const cleApi = etat.reglages.cleApi;
      Object.assign(etat, normaliserEtat(brut));
      etat.reglages.cleApi = cleApi;
      // Ce qui est déjà stocké au nouveau format n'est pas réécrit ; l'ancien format est converti
      if (Array.isArray(docs.etat.profils)) {
        for (const [k, data] of Object.entries(documentsAEnvoyer())) dernierEnvoi[k] = JSON.stringify(data);
      }
      ecrireLocal();
      notifierAbonnes();
      planifierEnvoi(); // convertit éventuellement l'ancien format
    } else if (etat.profils.some((p) => p.traitements.length)) {
      planifierEnvoi(); // première sauvegarde des données locales existantes
    }
    return true;
  } catch (e) {
    console.warn("Lecture du compte impossible", e);
    return false;
  }
}

function compteConnecte() { return !!compte; }

function ecrireLocal() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch { /* stockage indisponible */ }
}

function sauver() {
  ecrireLocal();
  planifierEnvoi();
  notifierAbonnes();
}

function aujourdhui(d = new Date()) {
  const z = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}

// ─────────── Profils (patients) ───────────
function ajouterProfil(champs) {
  const p = nouveauProfil({ nom: "Nouveau patient", ...champs });
  etat.profils.push(p);
  etat.profilActif = p.id;
  sauver();
  return p;
}

function majProfil(id, champs) {
  const p = etat.profils.find((x) => x.id === id);
  if (p) Object.assign(p, champs);
  sauver();
}

function supprimerProfil(id) {
  etat.profils = etat.profils.filter((p) => p.id !== id);
  if (!etat.profils.length) etat.profils.push(nouveauProfil());
  if (!etat.profils.some((p) => p.id === etat.profilActif)) etat.profilActif = etat.profils[0].id;
  sauver();
}

function choisirProfil(id) {
  if (etat.profils.some((p) => p.id === id)) { etat.profilActif = id; sauver(); }
}

// ─────────── Traitements du profil actif ───────────
function ajouterTraitement(t) {
  etat.traitements.push({ id: uid(), debut: aujourdhui(), ...t });
  sauver();
}

function majTraitement(id, champs) {
  const t = etat.traitements.find((x) => x.id === id);
  if (t) Object.assign(t, champs);
  sauver();
}

function supprimerTraitement(id) {
  etat.traitements = etat.traitements.filter((x) => x.id !== id);
  for (const k of Object.keys(etat.prises)) if (k.includes("|" + id + "|")) delete etat.prises[k];
  sauver();
}

function clePrise(date, id, heure) { return `${date}|${id}|${heure}`; }

function basculerPrise(date, id, heure) {
  const k = clePrise(date, id, heure);
  if (etat.prises[k]) delete etat.prises[k];
  else etat.prises[k] = new Date().toISOString();
  sauver();
}

/** Restaure une sauvegarde JSON (nouveau ou ancien format). */
function remplacerDonnees(d) {
  const cleApi = etat.reglages.cleApi;
  if (Array.isArray(d.profils)) {
    Object.assign(etat, normaliserEtat(d));
  } else {
    etat.traitements = d.traitements;
    etat.prises = d.prises || {};
    Object.assign(etat.reglages, d.reglages || {});
  }
  etat.reglages.cleApi = cleApi;
  sauver();
}

/** Remplace (ou complète) les traitements du profil actif avec un traitement transmis. */
function importerTraitements(traitements, { remplacer, heures }) {
  const neufs = traitements.map((t) => ({ ...t, id: uid() }));
  if (remplacer) { etat.traitements = neufs; etat.prises = {}; }
  else etat.traitements.push(...neufs);
  if (heures) Object.assign(etat.reglages.heures, heures);
  sauver();
}

async function toutEffacer() {
  const neuf = normaliserEtat();
  neuf.reglages.avertissementLu = true;
  Object.assign(etat, neuf);
  try { localStorage.removeItem(CLE); } catch { /* rien */ }
  if (compte) {
    await envoiEnCours;
    for (const id of Object.keys(dernierEnvoi)) {
      try { await compte.db.collection("data/users/" + compte.uid).doc(id).delete(); } catch { /* rien */ }
    }
    dernierEnvoi = {};
  }
  sauver();
}

// ── js/planning.js ──
// Calcul du planning des prises.

const JOUR_MS = 86400000;

function dateLocale(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}

/** Le traitement est-il actif à cette date ? */
function estActif(t, iso) {
  const jour = dateLocale(iso);
  const debut = dateLocale(t.debut);
  const ecart = Math.round((jour - debut) / JOUR_MS);
  if (ecart < 0) return false;
  if (t.dureeJours && ecart >= t.dureeJours) return false;
  if (t.hebdomadaire) return jour.getDay() === (t.jourSemaine ?? debut.getDay());
  return true;
}

/** Date de fin (dernier jour inclus) ou null. */
function dateFin(t) {
  if (!t.dureeJours) return null;
  return new Date(dateLocale(t.debut).getTime() + (t.dureeJours - 1) * JOUR_MS);
}

/** Heures de prise d'un traitement. */
function heuresDe(t, reglages) {
  if (t.heures && t.heures.length) return [...t.heures].sort();
  return MOMENTS.filter((m) => (t.moments || []).includes(m)).map((m) => reglages.heures[m]);
}

/** Liste triée des prises programmées pour une date. */
function prisesDuJour(iso, traitements, reglages) {
  const liste = [];
  for (const t of traitements) {
    if (t.siBesoin || !estActif(t, iso)) continue;
    for (const h of heuresDe(t, reglages)) {
      const moment = Object.entries(reglages.heures).find(([, v]) => v === h)?.[0] || null;
      liste.push({ heure: h, moment, t });
    }
  }
  return liste.sort((a, b) => a.heure.localeCompare(b.heure));
}

function libelleMoment(m) {
  return { matin: "Matin", midi: "Midi", soir: "Soir", coucher: "Coucher" }[m] || "";
}

function libelleQuantite(t) {
  const q = t.quantite ?? 1;
  const qs = q === 0.5 ? "½" : String(q).replace(".", ",");
  const u = t.unite || "prise";
  return `${qs} ${u}${q > 1 && !/s$/.test(u) ? "s" : ""}`;
}

function resumePosologie(t, reglages) {
  const parts = [libelleQuantite(t)];
  if (t.siBesoin) parts.push("si besoin");
  else if (t.heures?.length) parts.push("à " + t.heures.join(", "));
  else parts.push((t.moments || []).map(libelleMoment).join(" · ").toLowerCase());
  if (t.hebdomadaire) parts.push("1 fois/semaine");
  if (t.dureeJours) parts.push(`pendant ${t.dureeJours} j`);
  else parts.push("au long cours");
  return parts.join(" — ");
}

// ── js/alarmes.js ──
// Alarmes de prise.
// 1) Notifications du navigateur programmées tant que l'application est ouverte
//    (ou installée et active en arrière-plan selon le système).
// 2) Export d'un calendrier .ics avec alarmes : solution la plus fiable sur téléphone,
//    les rappels sont alors gérés par l'agenda du système même application fermée.



let minuteurs = [];

function notificationsSupportees() {
  return "Notification" in window;
}

async function demanderPermission() {
  if (!notificationsSupportees()) return "unsupported";
  if (Notification.permission === "granted") return "granted";
  return Notification.requestPermission();
}

function bip() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach((t) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.type = "sine";
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.25);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
  } catch { /* audio indisponible */ }
}

async function notifier(titre, corps, tag) {
  if (etat.reglages.son) bip();
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  if (!notificationsSupportees() || Notification.permission !== "granted") {
    alerteInterne(titre, corps);
    return;
  }
  const options = { body: corps, tag, icon: "icons/icon.svg", badge: "icons/icon.svg", requireInteraction: true, renotify: true };
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.showNotification(titre, options);
    else new Notification(titre, options);
  } catch {
    new Notification(titre, options);
  }
}

function alerteInterne(titre, corps) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = titre + "\n" + corps;
  el.classList.add("visible");
  setTimeout(() => el.classList.remove("visible"), 15000);
}

function aHeure(iso, hhmm) {
  const [y, m, d] = iso.split("-").map(Number);
  const [h, mi] = hhmm.split(":").map(Number);
  return new Date(y, m - 1, d, h, mi, 0);
}

/** (Re)programme les alarmes des prochaines 24 h. */
function planifierAlarmes() {
  minuteurs.forEach(clearTimeout);
  minuteurs = [];
  if (!etat.reglages.alarmes || etat.reglages.mode === "pro") return;
  const maintenant = Date.now();
  const demain = new Date(); demain.setDate(demain.getDate() + 1);
  for (const iso of [aujourdhui(), aujourdhui(demain)]) {
    // Regroupe les médicaments à prendre à la même heure
    const parHeure = new Map();
    for (const p of prisesDuJour(iso, etat.traitements, etat.reglages)) {
      if (!parHeure.has(p.heure)) parHeure.set(p.heure, []);
      parHeure.get(p.heure).push(p);
    }
    for (const [heure, prises] of parHeure) {
      const quand = aHeure(iso, heure).getTime();
      const relance = quand + etat.reglages.rappelMinutes * 60000;
      const corps = prises.map((p) => `• ${p.t.nom} : ${libelleQuantite(p.t)}`).join("\n");
      const restantes = () => prises.filter((p) => !etat.prises[clePrise(iso, p.t.id, heure)]);
      if (quand > maintenant && quand - maintenant < 86400000) {
        minuteurs.push(setTimeout(() => {
          if (restantes().length) notifier(`💊 Prise de ${heure}`, corps, `prise-${iso}-${heure}`);
        }, quand - maintenant));
      }
      if (etat.reglages.rappelMinutes > 0 && relance > maintenant && relance - maintenant < 86400000) {
        minuteurs.push(setTimeout(() => {
          const r = restantes();
          if (r.length) notifier(`⏰ Rappel : prise de ${heure} non cochée`, r.map((p) => `• ${p.t.nom}`).join("\n"), `rappel-${iso}-${heure}`);
        }, relance - maintenant));
      }
    }
  }
  // Re-planification à minuit passé
  const minuit = new Date(); minuit.setHours(24, 0, 30, 0);
  minuteurs.push(setTimeout(planifierAlarmes, minuit - maintenant));
}

function nombreAlarmesProgrammees() {
  return minuteurs.length;
}

// ─────────── Export iCalendar ───────────

function echapper(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

function plier(ligne) {
  // RFC 5545 : lignes de 75 octets max
  const out = [];
  let reste = ligne;
  while (reste.length > 73) { out.push(reste.slice(0, 73)); reste = " " + reste.slice(73); }
  out.push(reste);
  return out.join("\r\n");
}

function genererICS() {
  const z = (n) => String(n).padStart(2, "0");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lignes = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MedocPlanner//FR", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Mes traitements"];
  for (const t of etat.traitements) {
    if (t.siBesoin) continue;
    const med = t.medId ? trouverParId(t.medId) : null;
    const conseil = med?.moment || t.ficheIA?.moment || "";
    // premier jour actif (utile pour les prises hebdomadaires)
    let debut = new Date(t.debut + "T00:00:00");
    for (let i = 0; i < 7 && !estActif(t, aujourdhui(debut)); i++) debut.setDate(debut.getDate() + 1);
    for (const h of heuresDe(t, etat.reglages)) {
      const [hh, mm] = h.split(":");
      const dt = `${debut.getFullYear()}${z(debut.getMonth() + 1)}${z(debut.getDate())}T${hh}${mm}00`;
      let rrule = t.hebdomadaire ? "RRULE:FREQ=WEEKLY" : "RRULE:FREQ=DAILY";
      if (t.dureeJours) rrule += ";COUNT=" + (t.hebdomadaire ? Math.max(1, Math.ceil(t.dureeJours / 7)) : t.dureeJours);
      lignes.push(
        "BEGIN:VEVENT",
        `UID:${t.id}-${hh}${mm}@medoc-planner`,
        `DTSTAMP:${stamp}`,
        `DTSTART:${dt}`,
        "DURATION:PT10M",
        rrule,
        plier(`SUMMARY:${echapper(`💊 ${t.nom} – ${libelleQuantite(t)}`)}`),
        plier(`DESCRIPTION:${echapper([conseil, ...(t.remarques || [])].filter(Boolean).join("\n"))}`),
        "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${echapper("Prendre " + t.nom)}`, "TRIGGER:PT0M", "END:VALARM",
        "END:VEVENT",
      );
    }
  }
  lignes.push("END:VCALENDAR");
  return lignes.join("\r\n");
}

function telechargerICS() {
  const blob = new Blob([genererICS()], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mes-traitements.ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/** Horaires distincts des prises du jour, avec les médicaments concernés (pour régler des alarmes). */
function horairesAlarmes() {
  const parHeure = new Map();
  for (const p of prisesDuJour(aujourdhui(), etat.traitements, etat.reglages)) {
    if (!parHeure.has(p.heure)) parHeure.set(p.heure, []);
    parHeure.get(p.heure).push(p.t.nom);
  }
  return [...parHeure].map(([heure, noms]) => ({ heure, noms }));
}

// ── js/transfert.js ──
// Transmission d'un traitement du professionnel vers le téléphone du patient,
// sans serveur : le traitement est compressé dans un lien (après le « # », partie
// d'une adresse qui n'est jamais envoyée au serveur) affiché sous forme de QR code.

const PREFIXE = "import=";
const VERSION = 1;

// Champs utiles d'un traitement, sous forme compacte
function compacter(t) {
  const c = { n: t.nom, q: t.quantite, u: t.unite };
  if (t.medId) c.i = t.medId;
  if (t.moments?.length) c.m = encoderMoments(t.moments);
  if (t.heures?.length) c.h = t.heures;
  if (t.siBesoin) c.b = 1;
  if (t.hebdomadaire) c.w = 1;
  if (t.dureeJours) c.d = t.dureeJours;
  if (t.debut) c.s = t.debut;
  if (t.remarques?.length) c.r = t.remarques;
  if (t.ficheIA) c.f = t.ficheIA;
  return c;
}

const CODES_MOMENTS = { m: "matin", i: "midi", s: "soir", o: "coucher" };

function encoderMoments(moments) {
  return moments.map((m) => ({ matin: "m", midi: "i", soir: "s", coucher: "o" }[m])).join("");
}

function decompacter(c) {
  return {
    nom: String(c.n || "Médicament"),
    quantite: Number(c.q) || 1,
    unite: String(c.u || "prise"),
    medId: c.i || null,
    moments: typeof c.m === "string" ? [...c.m].map((x) => CODES_MOMENTS[x]).filter(Boolean) : [],
    heures: Array.isArray(c.h) ? c.h.filter((h) => /^\d{2}:\d{2}$/.test(h)) : [],
    siBesoin: !!c.b,
    hebdomadaire: !!c.w,
    dureeJours: Number(c.d) || null,
    debut: /^\d{4}-\d{2}-\d{2}$/.test(c.s) ? c.s : undefined,
    remarques: Array.isArray(c.r) ? c.r.map(String) : [],
    ...(c.f ? { ficheIA: c.f } : {}),
  };
}

function versBase64Url(octets) {
  let s = "";
  for (const o of octets) s += String.fromCharCode(o);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function depuisBase64Url(txt) {
  const s = atob(txt.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}

async function transformer(octets, flux) {
  const r = new Blob([octets]).stream().pipeThrough(flux);
  return new Uint8Array(await new Response(r).arrayBuffer());
}

/** Construit le code de transfert d'un profil. */
async function encoderTransfert(profil, heures) {
  const charge = {
    v: VERSION,
    p: profil.nom,
    hr: heures,
    t: profil.traitements.map(compacter),
    dt: new Date().toISOString().slice(0, 10),
  };
  const octets = new TextEncoder().encode(JSON.stringify(charge));
  if (typeof CompressionStream !== "undefined") {
    return "z" + versBase64Url(await transformer(octets, new CompressionStream("deflate-raw")));
  }
  return "j" + versBase64Url(octets);
}

/** Décode un code de transfert (ou un lien complet). */
async function decoderTransfert(texte) {
  const m = String(texte).match(/import=([A-Za-z0-9_-]+)/);
  const code = m ? m[1] : String(texte).trim();
  let octets = depuisBase64Url(code.slice(1));
  if (code[0] === "z") octets = await transformer(octets, new DecompressionStream("deflate-raw"));
  else if (code[0] !== "j") throw new Error("Code non reconnu");
  const c = JSON.parse(new TextDecoder().decode(octets));
  if (c.v !== VERSION || !Array.isArray(c.t)) throw new Error("Code non reconnu");
  const heures = {};
  for (const [k, v] of Object.entries(c.hr || {})) {
    if (Object.values(CODES_MOMENTS).includes(k) && /^\d{2}:\d{2}$/.test(v)) heures[k] = v;
  }
  return { patient: String(c.p || ""), date: c.dt || "", heures, traitements: c.t.map(decompacter), code };
}

/** Adresse de l'application à utiliser dans le lien. */
function adresseApplication(adressePublique) {
  if (adressePublique) return adressePublique.replace(/#.*$/, "");
  if (estClaude) return "";
  return location.origin + location.pathname;
}

function lienTransfert(adresse, code) {
  return adresse + "#" + PREFIXE + code;
}

/** Code présent dans l'adresse de la page ? */
function codeDansAdresse() {
  return location.hash.startsWith("#" + PREFIXE) ? location.hash.slice(1 + PREFIXE.length) : null;
}

/** QR code en SVG (bibliothèque qrcode-generator, chargée globalement). */
function qrSVG(texte) {
  if (typeof window.qrcode !== "function") throw new Error("Générateur de QR code indisponible");
  const qr = window.qrcode(0, "M");
  qr.addData(texte, "Byte");
  qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
}

// ─────────── Lecture d'un QR code avec la caméra (téléphone du patient) ───────────
let jsqrCharge = null;
function chargerJsQR() {
  jsqrCharge ||= new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "js/vendor/jsQR.js";
    s.onload = ok;
    s.onerror = () => ko(new Error("Lecteur de QR code indisponible"));
    document.head.appendChild(s);
  });
  return jsqrCharge;
}

function scannerPossible() {
  return !estClaude && !!navigator.mediaDevices?.getUserMedia;
}

/**
 * Ouvre la caméra dans `conteneur` et résout avec le texte du premier QR code lu.
 * Renvoie { resultat: Promise<string>, arreter() }.
 */
function scannerQR(conteneur) {
  let flux = null, fini = false, rafId = null;
  const video = document.createElement("video");
  video.setAttribute("playsinline", "");
  video.muted = true;
  video.className = "video-scan";
  conteneur.replaceChildren(video);
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  const arreter = () => {
    fini = true;
    cancelAnimationFrame(rafId);
    flux?.getTracks().forEach((t) => t.stop());
    conteneur.replaceChildren();
  };

  const resultat = (async () => {
    await chargerJsQR();
    flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = flux;
    await video.play();
    return new Promise((ok) => {
      const boucle = () => {
        if (fini) return;
        if (video.readyState >= 2 && video.videoWidth) {
          const l = 640, h = Math.round((video.videoHeight / video.videoWidth) * l);
          canvas.width = l; canvas.height = h;
          ctx.drawImage(video, 0, 0, l, h);
          const img = ctx.getImageData(0, 0, l, h);
          const code = window.jsQR(img.data, l, h, { inversionAttempts: "dontInvert" });
          if (code?.data) { arreter(); ok(code.data); return; }
        }
        rafId = requestAnimationFrame(boucle);
      };
      boucle();
    });
  })();
  resultat.catch(arreter);
  return { resultat, arreter };
}

// ── js/ocr.js ──
// Lecture de l'ordonnance à partir d'une photo.
//  - Mode local : OCR Tesseract.js (gratuit, dans le navigateur, adapté aux ordonnances imprimées)
//  - Mode IA (optionnel) : Claude (vision) avec la clé API de l'utilisateur, bien plus fiable,
//    y compris sur les ordonnances manuscrites.


const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const ANTHROPIC_SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm";
const MODELE_CLAUDE = "claude-opus-5-5";

/** Redimensionne l'image et la renvoie en JPEG (dataURL + base64). */
async function preparerImage(fichier, maxCote = 1800) {
  const url = URL.createObjectURL(fichier);
  try {
    const img = await new Promise((ok, ko) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => ko(new Error("Image illisible"));
      i.src = url;
    });
    const ratio = Math.min(1, maxCote / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * ratio);
    c.height = Math.round(img.height * ratio);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", 0.88);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.88));
    return { dataUrl, base64: dataUrl.split(",")[1], canvas: c, blob };
  } finally {
    URL.revokeObjectURL(url);
  }
}

function chargerScript(src) {
  return new Promise((ok, ko) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script");
    s.src = src;
    s.onload = ok;
    s.onerror = () => ko(new Error("Impossible de charger " + src + " (connexion internet requise)"));
    document.head.appendChild(s);
  });
}

/** OCR local, renvoie le texte brut. */
async function ocrLocal(canvas, onProgres = () => {}) {
  await chargerScript(TESSERACT_URL);
  // Pré-traitement : niveaux de gris + contraste
  const c = document.createElement("canvas");
  c.width = canvas.width; c.height = canvas.height;
  const ctx = c.getContext("2d");
  ctx.filter = "grayscale(1) contrast(1.4)";
  ctx.drawImage(canvas, 0, 0);
  const { data } = await window.Tesseract.recognize(c, "fra", {
    logger: (m) => { if (m.status === "recognizing text") onProgres(Math.round(m.progress * 100)); },
  });
  return data.text;
}

// ─────────────── Claude (optionnel) ───────────────

let clientCache = null;
async function client(cle) {
  if (clientCache && clientCache.cle === cle) return clientCache.client;
  const { default: Anthropic } = await import(ANTHROPIC_SDK_URL);
  // La clé reste sur l'appareil de l'utilisateur ; l'appel est fait directement depuis le navigateur.
  const c = new Anthropic({ apiKey: cle, dangerouslyAllowBrowser: true });
  clientCache = { cle, client: c };
  return c;
}

async function appelAPI(cle, contenu, schema, systeme) {
  const c = await client(cle);
  const reponse = await c.beta.messages.create({
    model: MODELE_CLAUDE,
    max_tokens: 16000,
    betas: ["server-side-fallback-2026-07-01"],
    fallbacks: "default",
    output_config: { effort: "medium", format: { type: "json_schema", schema } },
    system: systeme,
    messages: [{ role: "user", content: contenu }],
  });
  if (reponse.stop_reason === "refusal") throw new Error("Claude a refusé de traiter cette demande.");
  if (reponse.stop_reason === "max_tokens") throw new Error("Réponse tronquée, réessayez.");
  const texte = reponse.content.filter((b) => b.type === "text").map((b) => b.text).join("");
  return JSON.parse(texte);
}

// IA intégrée de claude.ai (aucune clé nécessaire)
async function appelIntegre({ consigne, systeme, schema, image, niveau = "default" }) {
  const sample = await capacite("sample");
  const prompt = `${systeme}\n\n${consigne}\n\nRéponds uniquement avec un objet JSON conforme à ce schéma JSON (tous les champs requis) :\n${JSON.stringify(schema)}`;
  try {
    return await sample.json(prompt, { modelTier: niveau, ...(image ? { images: [image] } : {}), cache: false });
  } catch (e) {
    const messages = {
      not_granted: "Autorisez l'accès à Claude pour cette page (menu Permissions de la page).",
      rate_limited: "Trop de demandes rapprochées : patientez une minute puis réessayez.",
      invalid_json: "La réponse de l'IA n'a pas pu être lue. Réessayez avec une photo plus nette.",
      image_rejected: "Image refusée : utilisez une photo JPEG ou PNG.",
    };
    throw new Error(messages[e?.code] || e?.message || "Erreur de l'IA");
  }
}

/** Quel moteur d'IA est disponible ? "integree" (claude.ai), "cle" (clé API) ou null. */
async function moteurIA(cle) {
  if (await capacite("sample")) return "integree";
  if (cle) return "cle";
  return null;
}

async function demander({ cle, consigne, systeme, schema, image, imageBase64, niveau }) {
  const moteur = await moteurIA(cle);
  if (moteur === "integree") {
    if (image && !(await iaIntegreeImages())) throw new Error("La lecture d'images n'est pas disponible dans cette vue.");
    return appelIntegre({ consigne, systeme, schema, image, niveau });
  }
  if (moteur === "cle") {
    const contenu = [];
    if (imageBase64) contenu.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageBase64 } });
    contenu.push({ type: "text", text: consigne });
    return appelAPI(cle, contenu, schema, systeme);
  }
  throw new Error("Aucune IA configurée.");
}

async function analyserPhoto(mode) {
  const prog = $("#progression");
  try {
    if (mode === "ia") {
      prog.innerHTML = `<div class="chargement">Lecture par l'IA en cours…</div>`;
      const r = await lireOrdonnanceIA(etat.reglages.cleApi, photo);
      if (!r.medicaments.length) {
        prog.innerHTML = `<div class="alerte warning">Aucun médicament trouvé sur cette photo. Essayez une photo plus nette, bien éclairée et cadrée sur l'ordonnance.</div>`;
        return;
      }
      brouillon = r.medicaments.map((m) => {
        const det = detecterMedicament(m.dci + " " + m.nom);
        return {
          nom: [m.nom, m.dosage && !String(m.nom).includes(m.dosage) ? m.dosage : ""].filter(Boolean).join(" "),
          medId: det?.med.id || null,
          dosage: m.dosage, quantite: m.quantite || 1, unite: m.unite || "prise",
          moments: (m.moments || []).filter((x) => MOMENTS.includes(x)),
          heures: (m.heures || []).filter((h) => /^\d{2}:\d{2}$/.test(h)), siBesoin: !!m.siBesoin,
          dureeJours: m.dureeJours, hebdomadaire: m.hebdomadaire,
          remarques: m.remarques || [], texteSource: m.texteSource, certitude: "haute",
          debut: aujourdhui(),
        };
      });
    } else {
      prog.innerHTML = `<div class="chargement">Lecture du texte… <span id="pct">0</span>%</div>`;
      const texte = await ocrLocal(photo.canvas, (p) => { const el = $("#pct"); if (el) el.textContent = p; });
      brouillon = analyserOrdonnance(texte);
      if (!brouillon.length) {
        prog.innerHTML = `<div class="alerte warning">Aucun médicament reconnu. Texte lu :<pre>${esc(texte)}</pre>Vous pouvez corriger ce texte dans la zone « Saisir le texte », ou ajouter les médicaments manuellement.</div>`;
        $("#texte-ordo").value = texte;
        return;
      }
    }
    rendre();
  } catch (e) {
    console.error(e);
    prog.innerHTML = `<div class="alerte danger">Erreur : ${esc(e.message)}</div>`;
  }
}

// ─────────────────────── Vue : planning ───────────────────────
function vuePlanning() {
  const prises = prisesDuJour(dateVue, etat.traitements, etat.reglages);
  const d = new Date(dateVue + "T12:00:00");
  const estAujourdhui = dateVue === aujourdhui();
  const faites = prises.filter((p) => etat.prises[clePrise(dateVue, p.t.id, p.heure)]).length;
  const siBesoin = etat.traitements.filter((t) => t.siBesoin && estActif(t, dateVue));

  // regroupement par heure
  const groupes = new Map();
  for (const p of prises) {
    if (!groupes.has(p.heure)) groupes.set(p.heure, []);
    groupes.get(p.heure).push(p);
  }
  const maintenant = new Date().toTimeString().slice(0, 5);

  return `
  <section class="carte">
    <div class="nav-date">
      <button class="bouton rond" data-action="jour" data-delta="-1" aria-label="Jour précédent">‹</button>
      <div>
        <div class="jour">${estAujourdhui ? "Aujourd'hui" : JOURS[d.getDay()]}</div>
        <div class="sous">${d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}</div>
      </div>
      <button class="bouton rond" data-action="jour" data-delta="1" aria-label="Jour suivant">›</button>
    </div>
    ${prises.length ? `
      <div class="progression-jour"><div style="width:${Math.round((faites / prises.length) * 100)}%"></div></div>
      <p class="sous centre">${faites} / ${prises.length} prise${prises.length > 1 ? "s" : ""} effectuée${faites > 1 ? "s" : ""}</p>` : ""}
  </section>

  ${!etat.traitements.length ? `
    <section class="carte vide">
      <p>Aucun traitement enregistré.</p>
      <button class="bouton principal" data-action="aller" data-vue="ordonnance">📷 Scanner une ordonnance</button>
    </section>` : ""}

  ${[...groupes].map(([heure, liste]) => {
    const toutFait = liste.every((p) => etat.prises[clePrise(dateVue, p.t.id, heure)]);
    const enRetard = estAujourdhui && !toutFait && heure < maintenant;
    return `
    <section class="carte creneau ${toutFait ? "fait" : ""} ${enRetard ? "retard" : ""}">
      <div class="creneau-tete">
        <span class="heure">${heure}</span>
        <span class="sous">${liste[0].moment ? libelleMoment(liste[0].moment) : ""}${enRetard ? " · en retard" : ""}</span>
      </div>
      <ul class="liste">
        ${liste.map((p) => {
          const pris = etat.prises[clePrise(dateVue, p.t.id, heure)];
          const med = p.t.medId ? trouverParId(p.t.medId) : null;
          const conseil = med?.moment || p.t.ficheIA?.moment || "";
          return `
          <li class="prise ${pris ? "prise-ok" : ""}">
            <label>
              <input type="checkbox" data-action="cocher" data-id="${p.t.id}" data-heure="${heure}" ${pris ? "checked" : ""}>
              <span>
                <strong>${esc(p.t.nom)}</strong>
                <span class="sous">${esc(libelleQuantite(p.t))}${conseil ? " · " + esc(conseil) : ""}</span>
                ${pris ? `<span class="sous ok">✓ pris à ${new Date(pris).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</span>` : ""}
              </span>
            </label>
          </li>`;
        }).join("")}
      </ul>
    </section>`;
  }).join("")}

  ${siBesoin.length ? `
    <section class="carte">
      <h3>Si besoin</h3>
      <ul class="liste">${siBesoin.map((t) => `<li><strong>${esc(t.nom)}</strong><div class="sous">${esc(resumePosologie(t, etat.reglages))}</div></li>`).join("")}</ul>
    </section>` : ""}

  ${etat.traitements.length ? `
    <section class="carte">
      <h3>Mes traitements</h3>
      <ul class="liste">
        ${etat.traitements.map((t) => {
          const fin = dateFin(t);
          const termine = fin && fin < new Date(aujourdhui() + "T00:00:00");
          return `
          <li class="${termine ? "termine" : ""}">
            <div class="ligne-titre"><strong>${esc(t.nom)}</strong>${termine ? '<span class="pastille">terminé</span>' : ""}</div>
            <div class="sous">${esc(resumePosologie(t, etat.reglages))}</div>
            <div class="sous">Depuis le ${new Date(t.debut + "T12:00:00").toLocaleDateString("fr-FR")}${fin ? " jusqu'au " + fin.toLocaleDateString("fr-FR") : ""}</div>
            <div class="ligne-boutons petit">
              <button class="bouton" data-action="editer" data-id="${t.id}">Modifier</button>
              <button class="bouton" data-action="supprimer" data-id="${t.id}">Supprimer</button>
            </div>
          </li>`;
        }).join("")}
      </ul>
      <button class="bouton large" data-action="nouveau">➕ Ajouter un médicament</button>
